name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  quality:
    name: Quality
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Install uv and Python
        uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b
        with:
          python-version: "3.12"
          enable-cache: true

      - name: Install locked dependencies
        run: uv sync --locked --all-groups

      - name: Lint
        run: uv run ruff check src tests scripts

      - name: Type check
        run: uv run mypy src

      - name: Test unit and API suites
        run: uv run pytest tests/unit tests/api -q

      - name: Verify generated Import Bundle schema
        run: uv run python scripts/export_import_schema.py --check

  manual-compose-integration:
    name: Manual Compose integration
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Install uv and Python
        uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b
        with:
          python-version: "3.12"
          enable-cache: true

      - name: Install locked dependencies
        run: uv sync --locked --all-groups

      - name: Run the full local integration test
        run: ./scripts/test_integration.sh

      - name: Show service status on failure
        if: failure()
        run: docker compose ps --all
